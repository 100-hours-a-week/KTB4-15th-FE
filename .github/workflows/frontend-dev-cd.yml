# FE 레포 dev CD (develop 브랜치 → Single Dev EC2)
# - develop push: ARM64 이미지 빌드 → ECR push(태그 = 커밋 SHA 7자리) → SSM Document로 EC2의 FE 컨테이너 교체
# - workflow_dispatch: 이미 ECR에 있는 태그로 빌드 없이 교체(롤백)
# - 무중단 배포는 하지 않는다. EC2의 update-image.sh가 FE 컨테이너만 다시 띄우고 healthy를 기다리며,
#   실패하면 이전 digest로 되돌린다.
# - ECR이 IMMUTABLE이라 같은 태그는 덮어쓰지 못한다.
# - 저장소 변수: AWS_DEPLOY_ROLE_ARN, SINGLE_DEV_INSTANCE_ID
#   OIDC Role은 refs/heads/develop만 신뢰하므로 job에 environment를 두지 않는다(environment를 쓰면 sub가 바뀐다).
name: FE dev CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('FE dev deploy - {0}', github.sha)
      || format('FE dev rollback - {0}', inputs.image_tag) }}

on:
  push:
    branches: ["develop"]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "사유"
        required: true
        type: string

permissions: {}

concurrency:
  group: lookddak-single-dev-nextjs
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-dev-nextjs
  SSM_DOCUMENT: lookddak-dev-single-update-nextjs

jobs:
  deploy:
    name: dev-deploy
    # EC2가 ARM64(Graviton)라 ARM 러너에서 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Guard - develop 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' }}
        run: |
          echo "develop 브랜치에서만 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 이미지 태그 결정
        id: vars
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="${GITHUB_SHA::7}"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::이미지 태그는 7자리 SHA여야 합니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        if: ${{ github.event_name == 'push' }}
        uses: docker/setup-buildx-action@v3

      # target을 지정하지 않는다 → builder(lint + next build)와 runtime을 모두 빌드한다.
      # lint나 타입 오류가 있으면 이미지가 만들어지지 않는다.
      # NEXT_PUBLIC_* 값은 브라우저 코드에 박히므로 빌드 시점에 build-args로 넣는다.
      # API 주소는 접속한 호스트를 따르는 상대 경로로 빌드한다.
      # Clarity·Sentry 값은 넘기지 않는다 (dev 트래픽이 운영 분석·에러 집계에 섞이지 않게).
      - name: 빌드 및 ECR push
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1/
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 빌드와 롤백 모두 ECR에서 digest를 조회해 같은 방식으로 고정한다.
      - name: 이미지 digest 조회
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text) \
            || { echo "::error::ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "ref=${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Single Dev EC2 이미지 교체
        env:
          INSTANCE_ID: ${{ vars.SINGLE_DEV_INSTANCE_ID }}
          IMAGE: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOCUMENT" \
            --parameters "image=${IMAGE}" \
            --comment "nextjs ${TAG} by ${GITHUB_ACTOR}" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true

          {
            echo "### FE dev 배포: ${STATUS}"
            echo "- 이미지: \`${IMAGE}\`"
            echo "- 태그: \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::Single Dev 배포 실패: ${STATUS}"
            exit 1
          fi
